<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="무지개 피아노" />
  <title>🌈 무지개 피아노 교실 — 리듬게임 동요 피아노</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top-bar">
    <div class="brand-wrap">
      <span class="logo-badge" aria-hidden="true">🎹</span>
      <div>
        <h1 class="app-title">무지개 리듬 피아노</h1>
        <p class="app-subtitle">위에서 내려오는 무지개 게이지를 맞춰 건반을 눌러봐요!</p>
      </div>
    </div>

    <div class="top-right-group">
      <div class="star-counter" id="starCounter" title="노래를 끝까지 연주하면 칭찬 별이 모여요!">
        <span>⭐ 칭찬 별</span>
        <strong id="starCountValue">0</strong>
      </div>
      <button type="button" class="install-btn" id="installAppBtn" hidden>
        📲 앱 설치하기
      </button>
    </div>
  </header>

  <main class="piano-stage">
    <!-- 1. 상단 보조 설정 바 (악기 소리 · 건반 옵션 · 녹음) -->
    <section class="sound-toolbar" aria-label="악기 및 연습 설정">
      <div class="instrument-group" role="group" aria-label="악기 소리 선택">
        <button type="button" class="inst-btn active" data-inst="piano">🎹 피아노</button>
        <button type="button" class="inst-btn" data-inst="xylophone">🔔 실로폰</button>
        <button type="button" class="inst-btn" data-inst="organ">🎺 아코디언</button>
        <button type="button" class="inst-btn" data-inst="synth">🚀 우주 신스</button>
      </div>

      <div class="utility-group">
        <button type="button" class="tool-toggle active" id="rainbowToggleBtn" aria-pressed="true">
          🌈 무지개 계이름
        </button>
        <button type="button" class="tool-toggle" id="octaveToggleBtn" aria-pressed="false">
          👐 넓은 건반
        </button>
        <button type="button" class="record-btn" id="recordBtn">
          🔴 녹음
        </button>
        <button type="button" class="play-rec-btn" id="playRecBtn" disabled>
          ▶️ 듣기
        </button>
      </div>
    </section>

    <!-- 2. 피아노 일체형 리듬게임 콘솔 (곡 선택 + 낙하 노트 트랙 + 건반 직결!) -->
    <section class="piano-console" aria-label="리듬게임 스테이지 및 피아노 건반">
      <div class="music-stand">
        <!-- 모드 선택 & 빠르기 컨트롤 -->
        <div class="now-playing-row">
          <div class="now-playing-prompt" id="nowPlayingPrompt">
            <span class="prompt-badge" id="promptBadge">🐣 기다려주는 리듬연습</span>
            <span class="prompt-text" id="promptText">내려오는 막대가 판정선에 닿으면 건반을 눌러보세요!</span>
          </div>

          <div class="stand-controls">
            <button type="button" class="action-btn practice active" id="startPracticeBtn" title="막대가 건반 위에서 내가 누를 때까지 기다려줘요!">
              🐣 기다려주는 연습
            </button>
            <button type="button" class="action-btn arcade" id="startArcadeBtn" title="막대가 멈추지 않고 내려오는 실전 리듬게임!">
              🎮 실전 리듬게임
            </button>
            <button type="button" class="action-btn demo" id="startDemoBtn" title="자동으로 연주되는 모습을 감상해요!">
              🎧 자동 연주
            </button>
            <button type="button" class="action-btn reset" id="resetSongBtn" title="처음부터 다시">
              🔄 처음부터
            </button>
            <div class="tempo-group" role="group" aria-label="연주 빠르기">
              <button type="button" class="tempo-btn" data-speed="0.72">🐢 느리게</button>
              <button type="button" class="tempo-btn active" data-speed="1">🐰 보통</button>
              <button type="button" class="tempo-btn" data-speed="1.28">🚀 빠르게</button>
            </div>
          </div>
        </div>

        <!-- 건반 바로 위에 밀착된 곡 제목 선택 도크 -->
        <div class="song-selector-dock">
          <span class="row-label">🎵 곡 선택</span>
          <div class="song-pills" id="songPills" role="tablist" aria-label="노래 목록"></div>
        </div>
      </div>

      <!-- 3. 리듬게임 노트 낙하 트랙 + 피아노 건반 (가로 스크롤 및 건반 폭 1:1 완전 동기화!) -->
      <div class="keyboard-frame">
        <!-- 상단 HUD (점수 · 콤보 · 진행바 · 판정 이펙트) -->
        <div class="rhythm-hud">
          <div class="hud-left">
            <span class="song-now-title" id="hudSongTitle">🔥 퇴사할게여 (소연)</span>
            <div class="progress-track" title="곡 진행률">
              <div class="progress-fill" id="songProgressFill"></div>
            </div>
          </div>
          <div class="hud-right">
            <span class="combo-pill" id="comboBadge">🔥 0 COMBO</span>
            <span class="score-pill" id="scoreBadge">🏆 0점</span>
          </div>
        </div>

        <div class="keyboard-scroll-wrap" id="keyboardScrollWrap">
          <!-- 위에서 아래로 게이지가 쭈우우욱 내려오는 낙하 하이웨이 -->
          <div class="falling-highway" id="fallingHighway" aria-hidden="true">
            <div class="highway-lanes" id="highwayLanes"></div>
            <div class="falling-notes-layer" id="fallingNotesLayer"></div>
            <div class="hit-line-glow">
              <span class="hit-line-label">⚡ 여기를 지나갈 때 건반을 톡! ⚡</span>
            </div>
            <div class="judge-popup" id="judgePopup" hidden>PERFECT! ⭐</div>
          </div>

          <!-- 피아노 건반 본체 (낙하 트랙 바로 밑에 1:1 연결!) -->
          <div class="piano-keys-container" id="pianoKeysContainer">
            <!-- JS 렌더링: 흰 건반 & 검은 건반 -->
          </div>
        </div>

        <!-- 하단 미니 가사·계이름 미리보기 리본 (클릭 시 해당 구간 이동 가능) -->
        <div class="mini-ribbon-bar">
          <span class="mini-ribbon-label">🎼 전체 계이름</span>
          <div class="note-ribbon-scroll" id="noteRibbonScroll">
            <div class="note-ribbon" id="noteRibbon" role="list" aria-label="계이름 악보"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 완주 축하 팝업 -->
  <div class="bravo-overlay" id="bravoOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="bravoTitle">
    <div class="bravo-card">
      <div class="bravo-stars" aria-hidden="true">⭐⭐⭐</div>
      <h2 id="bravoTitle">우와! 끝까지 멋지게 연주했어요! 🎉</h2>
      <p id="bravoDesc">참 잘했어요! 칭찬 별 스티커 1개를 선물로 받았어요!</p>
      <div class="bravo-actions">
        <button type="button" class="action-btn practice" id="replaySongBtn">🎵 한 번 더 치기</button>
        <button type="button" class="action-btn demo" id="nextSongBtn">⏭️ 다음 노래 도전!</button>
      </div>
    </div>
  </div>

  <!-- 폭죽 효과 레이어 -->
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

  <script src="fortune-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
